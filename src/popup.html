<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Outline Progress</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-head">
        <span class="popup-logo">🍟</span>
        <div>
          <h1>Food Outline</h1>
          <p>Прогресс обводки · v0.1.9</p>
        </div>
      </header>

      <section class="card">
        <div class="row">
          <span>Карточка</span>
          <b id="current-id">—</b>
        </div>
        <div class="row">
          <span>Диапазон</span>
          <b id="range">—</b>
        </div>
        <div class="row">
          <span>Готово</span>
          <b id="progress">—</b>
        </div>
        <div class="bar"><i id="bar"></i></div>
        <p id="status" class="status">Ищу активную вкладку…</p>
      </section>

      <section class="actions">
        <button id="open-panel" class="primary" type="button">Открыть панель</button>
        <button id="permission" class="primary" type="button" hidden>
          Разрешить доступ к сайтам
        </button>
        <button id="done" type="button">✓ Готово</button>
        <button id="next" type="button">Следующий →</button>
        <button id="ingredients" type="button" class="wide">🥕 Ингредиенты</button>
      </section>

      <section class="card hint">
        <p>Панель работает на CVAT и локальном CVAT.</p>
        <p>Горячие клавиши: <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>D</kbd> — готово,
          <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>N</kbd> — следующий.</p>
        <button id="options" class="link" type="button">Настройки и экспорт</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
