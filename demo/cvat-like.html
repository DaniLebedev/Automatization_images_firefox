<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CVAT-like frame input — Food Outline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0f1115; color: #eef0f4; }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 18px;
        background: #171a20;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }
      .brand { font-weight: 800; color: #ffb86b; }
      .spacer { flex: 1; }
      .frame-box {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 8px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 8px;
        background: rgba(255,255,255,.05);
      }
      input.ant-input-number-input {
        width: 74px;
        padding: 5px 7px;
        border: 0;
        border-radius: 5px;
        background: #0d0f13;
        color: #fff;
        font: 600 14px/1.2 system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 22px 18px;
        display: grid;
        gap: 14px;
      }
      .viewer {
        aspect-ratio: 4 / 3;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 16px;
        background:
          radial-gradient(circle at 50% 42%, #f4e2b8 0 24%, #d8b57a 25% 42%, #8b5b2a 43% 100%);
        display: grid;
        place-items: center;
        font-size: clamp(46px, 9vw, 110px);
      }
      .status { color: #9aa3af; font-size: 13px; }
      code { color: #ffb86b; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">CVAT-like demo</span>
      <span class="status">поле кадра как в CVAT</span>
      <span class="spacer"></span>
      <div class="frame-box">
        <span class="status">Frame</span>
        <input
          autocomplete="off"
          role="spinbutton"
          aria-valuemin="0"
          aria-valuemax="999"
          aria-valuenow="650"
          step="1"
          type="number"
          class="ant-input-number-input"
          value="650"
        />
      </div>
    </header>
    <main>
      <div class="viewer" id="food">🐟 🍟</div>
      <p class="status">
        Текущий кадр: <code id="frame">650</code>.
        Нажмите «Следующий» в панели расширения или введите число и Enter.
      </p>
      <p class="status">
        Панель должна прочитать <code>650</code> из input и перейти на следующий
        кадр без перезагрузки страницы.
      </p>
    </main>
    <script>
      (function () {
        const input = document.querySelector("input.ant-input-number-input");
        const frame = document.getElementById("frame");
        const food = document.getElementById("food");
        const dishes = ["🐟 🍟", "🍔 🍟", "🍗 🥗", "🌮 🍟", "🍕 🥗", "🍣 🍱"];
        function commit() {
          const value = Math.min(999, Math.max(0, Number(input.value) || 0));
          input.setAttribute("aria-valuenow", String(value));
          input.value = String(value);
          frame.textContent = String(value);
          food.textContent = dishes[value % dishes.length];
        }
        input.addEventListener("change", commit);
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            commit();
          }
        });
        commit();
      })();
    </script>
  </body>
</html>
