<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo CVAT task — Food Outline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f1115;
        color: #eef0f4;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 18px;
        background: #171a20;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }
      .brand { font-weight: 800; color: #ffb86b; }
      .muted { color: #8b93a0; font-size: 12px; }
      main {
        display: grid;
        grid-template-columns: 210px 1fr;
        gap: 18px;
        padding: 18px;
        max-width: 1100px;
        margin: 0 auto;
      }
      aside, .viewer {
        background: #171a20;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 14px;
        padding: 14px;
      }
      aside { display: grid; gap: 10px; align-content: start; }
      label { display: grid; gap: 5px; color: #8b93a0; font-size: 11px; }
      input {
        width: 100%;
        padding: 8px 9px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,.14);
        background: rgba(255,255,255,.06);
        color: #fff;
        font: 600 14px/1.2 system-ui, sans-serif;
      }
      button {
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 8px;
        padding: 8px 10px;
        background: rgba(255,255,255,.07);
        color: #eef0f4;
        font: 650 12px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,.13); }
      .viewer { display: grid; gap: 12px; }
      .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .frame-badge {
        margin-left: auto;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(255,159,67,.16);
        color: #ffb86b;
        font-weight: 700;
      }
      .photo {
        position: relative;
        aspect-ratio: 4 / 3;
        border-radius: 12px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, #f2d9a8 0 28%, #d7b77a 29% 45%, #8b5b2a 46% 100%);
        display: grid;
        place-items: center;
        color: #3b250d;
        text-align: center;
      }
      .photo::before {
        content: "";
        position: absolute;
        inset: 13% 16%;
        border-radius: 50%;
        background: #f7f1e3;
        box-shadow: inset 0 0 0 10px rgba(0,0,0,.05);
      }
      .food {
        position: relative;
        z-index: 1;
        font-size: clamp(38px, 8vw, 84px);
        transform: rotate(-8deg);
      }
      .caption {
        position: absolute;
        left: 14px;
        bottom: 12px;
        z-index: 1;
        padding: 6px 9px;
        border-radius: 8px;
        background: rgba(0,0,0,.45);
        color: #fff;
        font: 600 12px/1.3 system-ui, sans-serif;
      }
      .legend { display: flex; gap: 14px; flex-wrap: wrap; color: #8b93a0; font-size: 11px; }
      kbd {
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255,255,255,.09);
        font: 11px/1.2 ui-monospace, monospace;
      }
      @media (max-width: 760px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">🍟 Food Outline</span>
      <span class="muted">Демо-задача CVAT · диапазон ID и прогресс</span>
    </header>
    <main>
      <aside>
        <label>
          Текущий кадр
          <input id="frame-input" type="number" min="0" max="99" value="10" />
        </label>
        <button id="go" type="button">Перейти</button>
        <button id="prev" type="button">← Предыдущий</button>
        <button id="next" type="button">Следующий →</button>
        <p class="muted" id="url-label"></p>
        <p class="muted">
          Панель расширения должна появиться справа внизу. Если её нет —
          загрузите расширение через <kbd>about:debugging</kbd>.
        </p>
      </aside>
      <section class="viewer">
        <div class="toolbar">
          <strong>Frame</strong>
          <span id="frame-label">10</span>
          <span class="frame-badge" id="frame-badge">#10</span>
        </div>
        <div class="photo">
          <div class="food" id="food">🐟 🍟</div>
          <div class="caption" id="caption">frame 10 / 100</div>
        </div>
        <div class="legend">
          <span>URL: <code id="url-code"></code></span>
          <span>Alt+Shift+D — отметить</span>
          <span>Alt+Shift+N — следующий</span>
        </div>
      </section>
    </main>
    <script>
      (function () {
        const input = document.getElementById("frame-input");
        const label = document.getElementById("frame-label");
        const badge = document.getElementById("frame-badge");
        const caption = document.getElementById("caption");
        const urlLabel = document.getElementById("url-label");
        const urlCode = document.getElementById("url-code");
        const food = document.getElementById("food");
        const total = 100;
        const dishes = ["🐟 🍟", "🍔 🍟", "🍗 🥗", "🌮 🍟", "🍕 🥗", "🍣 🍱"];

        function frame() {
          const value = Number(new URL(location.href).searchParams.get("frame"));
          return Number.isFinite(value) ? Math.min(total - 1, Math.max(0, value)) : 0;
        }

        function update() {
          const current = frame();
          input.value = String(current);
          label.textContent = String(current);
          badge.textContent = `#${current}`;
          caption.textContent = `frame ${current} / ${total}`;
          urlLabel.textContent = `ID ${current} · ${location.pathname}`;
          urlCode.textContent = location.href;
          food.textContent = dishes[current % dishes.length];
          document.title = `Frame ${current} — Demo CVAT`;
        }

        function goTo(next) {
          const url = new URL(location.href);
          url.searchParams.set("frame", String(next));
          history.pushState({}, "", url);
          update();
        }

        document.getElementById("go").addEventListener("click", () => {
          goTo(Number(input.value) || 0);
        });
        document.getElementById("prev").addEventListener("click", () => {
          goTo(Math.max(0, frame() - 1));
        });
        document.getElementById("next").addEventListener("click", () => {
          goTo(Math.min(total - 1, frame() + 1));
        });
        input.addEventListener("change", () => goTo(Number(input.value) || 0));
        window.addEventListener("popstate", update);
        if (!new URL(location.href).searchParams.has("frame")) {
          goTo(0);
        } else {
          update();
        }
      })();
    </script>
  </body>
</html>
